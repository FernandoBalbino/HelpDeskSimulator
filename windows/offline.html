<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <link rel="icon" type="image/png" href="./assets/icons/pwa-192.png">
  <title>OSLab — modo offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#080808;color:#fff;font-family:"Segoe UI",Arial,sans-serif}.card{width:min(560px,100%);padding:48px;border:1px solid #3a3a3a;border-radius:20px;background:#202020;box-shadow:0 24px 70px rgba(0,0,0,.55);text-align:center}.icon{width:96px;height:96px;border-radius:20px}h1{margin:24px 0 12px;font-size:clamp(2rem,7vw,3.2rem);line-height:1}p{max-width:42ch;margin:0 auto 28px;color:#c7c7c7;font-size:1.05rem;line-height:1.6}a,button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border:1px solid #63a8df;border-radius:8px;background:#0067c0;color:#fff;font:600 1rem "Segoe UI",Arial,sans-serif;text-decoration:none;cursor:pointer}.secondary{margin-left:8px;background:#2d2d2d}@media(max-width:460px){.card{padding:36px 20px}.secondary{margin:10px 0 0}}
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="./assets/icons/pwa-192.png" alt="">
    <h1>OSLab está offline.</h1>
    <p>O laboratório, as missões e os recursos do sistema estão salvos neste dispositivo. Volte à tela inicial para continuar.</p>
    <a href="./index.html">Abrir o OSLab</a>
    <button class="secondary" type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
