<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f55821">
  <meta name="description" content="Assuma o suporte técnico, converse com dez clientes e resolva problemas em computadores Windows simulados.">
  <title>HelpDesk Simulator — Central de Suporte Técnico</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/helpdesk.css">
  <script type="module" src="./js/helpdesk/app.mjs"></script>
</head>
<body>
  <div id="app"></div>
  <section id="notifications" class="notifications" aria-live="polite" aria-label="Notificações"></section>
  <dialog id="image-dialog" class="image-dialog"><button type="button" data-close-image aria-label="Fechar imagem">×</button><img alt="Imagem enviada pelo cliente"><p></p></dialog>
  <dialog id="reset-dialog" class="confirm-dialog"><div class="dialog-icon">↻</div><h2>Reiniciar o expediente?</h2><p>As conversas, as correções e o relatório deste expediente serão apagados. Você começará um novo atendimento.</p><div><button type="button" data-reset-cancel>Continuar expediente</button><button type="button" class="primary" data-reset-confirm>Reiniciar</button></div></dialog>
  <noscript>Ative o JavaScript para usar a Central de Suporte Técnico.</noscript>
</body>
</html>
